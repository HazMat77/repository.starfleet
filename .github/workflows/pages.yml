name: Deploy Pages

# The auto-scraper commits to data/*.json every 10-60 seconds during active
# periods -- with the old branch-build (legacy) Pages source, every one of
# those commits queued a new build and immediately invalidated whatever
# build was already in flight, so a Starfleet release commit almost never
# got a wide enough gap to actually finish publishing. paths-ignore here
# means a commit that only touches data/** doesn't trigger this workflow
# at all, so Pages only rebuilds when something addon-relevant actually
# changes.
on:
  push:
    branches: [repository.starfleet]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:
  # Self-heal, since paths-ignore above means a scraper-only commit (every
  # one of them, all day) never triggers a rebuild on its own. Confirmed
  # live 2026-09-05: Pages sat on a stale build for hours (data/*.json kept
  # updating underneath it every ~30min, Pages itself never rebuilt) simply
  # because no addon-code push happened to land in that window — MutStreams/
  # StreamsEast/SportsBite/the Sportsurge cf_clearance cookie all silently
  # served old data to every user the whole time. Hourly is far below
  # GitHub's Pages rate limits and guarantees data/** is never more than
  # ~1h stale even during a long gap between real addon releases.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
